var MAP_VAR = 'map_207ccddcb43c619f919fcbbef9f5d35b';
function getMap() { return window[MAP_VAR]; }
var animIdx = -1;
var animTimer = null;
var traveller = null;

function makeTraveller() {
    var el = L.divIcon({
        html: '<div style="font-size:34px;text-align:center;line-height:1;'
            + 'filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">🚣</div>',
        className: '', iconSize: [40, 40], iconAnchor: [20, 20]
    });
    if (traveller) { getMap().removeLayer(traveller); }
    traveller = L.marker([STOPS[0].lat, STOPS[0].lng], { icon: el, zIndexOffset: 1000 }).addTo(getMap());
}

function flyToStop(i) {
    animIdx = i;
    var s = STOPS[i];
    document.getElementById('anim_status').innerHTML =
        '第 ' + (i+1) + ' / ' + STOPS.length + ' 站 · ' + s.name;
    traveller.setLatLng([s.lat, s.lng]);
    getMap().flyTo([s.lat, s.lng], i < 2 ? 4 : 10, { duration: 0.8 });
    getMap(); L.popup({ closeButton: false, className: 'anim-popup' })
        .setLatLng([s.lat, s.lng])
        .setContent('<b>' + s.name + '</b><br>' + s.d + '<br>' + s.sub)
        .openOn(getMap());
}

function animPlay() {
    if (animTimer) { clearInterval(animTimer); }
    if (animIdx >= STOPS.length - 1) { animReset(); }
    makeTraveller();
    flyToStop(0);
    var i = 1;
    animTimer = setInterval(function() {
        if (i >= STOPS.length) {
            clearInterval(animTimer);
            animTimer = null;
            document.getElementById('anim_status').innerHTML =
                '🎉 27天 · 4站藤校 + MIT · 全程完成！凯旋返沪 ✈️';
            getMap().flyTo([39.0, -84.0], 4, { duration: 1.5 });
            return;
        }
        flyToStop(i);
        i++;
    }, 1800);
}

function animReset() {
    if (animTimer) { clearInterval(animTimer); animTimer = null; }
    animIdx = -1;
    if (traveller) { getMap().removeLayer(traveller); traveller = null; }
    document.getElementById('anim_status').innerHTML = '第 1 / ' + STOPS.length + ' 站 · 上海浦东 PVG';
    getMap().flyTo([39.0, -84.0], 4, { duration: 1.0 });
}
