var MAP_VAR = 'map_d135e271c19b59ba0657db1354c8ab9b';
function getMap() { return window[MAP_VAR]; }
var traveller = null;
var animBusy = false;
var animToken = 0;

function makeVehicle(icon) {
    var el = L.divIcon({
        html: '<div style="font-size:32px;text-align:center;line-height:1;'
            + 'filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));">' + icon + '</div>',
        className: '', iconSize: [42, 42], iconAnchor: [21, 21]
    });
    if (traveller) { getMap().removeLayer(traveller); }
    traveller = L.marker([LEGS[0].path[0][0], LEGS[0].path[0][1]], { icon: el, zIndexOffset: 1000 }).addTo(getMap());
    return traveller;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 沿路径平滑移动：交通工具图标逐点插值
async function moveAlong(marker, path, durationMs, token) {
    var steps = path.length - 1;
    var stepMs = durationMs / steps;
    for (var i = 0; i <= steps; i++) {
        if (token !== animToken) return;
        var p = path[i];
        marker.setLatLng([p[0], p[1]]);
        if (i % 6 === 0) {
            // 相机缓慢跟随（间隔跳帧避免卡顿）
            getMap().panTo([p[0], p[1]], { animate: false });
        }
        await sleep(stepMs);
    }
}

function showStation(i) {
    var s = STOPS[i];
    document.getElementById('anim_status').innerHTML =
        '第 ' + (i+1) + ' / ' + STOPS.length + ' 站 · ' + s.name;
    getMap(); L.popup({ closeButton: false, className: 'anim-popup' })
        .setLatLng([s.lat, s.lng])
        .setContent('<b>' + s.name + '</b><br>' + s.d + '<br>' + s.sub)
        .openOn(getMap());
}

function showLeg(leg) {
    document.getElementById('anim_status').innerHTML =
        leg.icon + ' ' + leg.mode + ' · ' + leg.from_name + ' → ' + leg.to_name +
        ' · ≈' + leg.dist + 'km · ' + leg.desc;
}

async function animPlay() {
    if (animBusy) return;
    animBusy = true;
    animReset(false);
    animToken++;
    var token = animToken;
    var m = makeVehicle('🚣');
    // 第1站（上海出发）
    m.setLatLng([STOPS[0].lat, STOPS[0].lng]);
    showStation(0);
    await sleep(900);
    var i;
    for (i = 0; i < LEGS.length; i++) {
        if (token !== animToken) return;
        var leg = LEGS[i];
        showLeg(leg);
        // 切换成该段交通工具图标
        makeVehicle(leg.icon);
        m = traveller;
        m.setLatLng([leg.path[0][0], leg.path[0][1]]);
        var zoom = (leg.mode === '飞机') ? 3 : (leg.dist > 300 ? 6 : 8);
        getMap().flyTo([leg.path[0][0], leg.path[0][1]], zoom, { duration: 0.5 });
        await moveAlong(m, leg.path, leg.dur * 1000, token);
        // 到站
        if (leg.to_idx !== null) {
            showStation(leg.to_idx);
        } else {
            document.getElementById('anim_status').innerHTML =
                '🛬 8/15 抵达上海 · 凯旋归来！';
        }
        await sleep(800);
    }
    if (token !== animToken) return;
    document.getElementById('anim_status').innerHTML =
        '🎉 泰州25天 + 美国27天 · 全程完成！凯旋返沪 ✈️';
    getMap().flyTo([30.0, -20.0], 2, { duration: 2.0 });
    animBusy = false;
}

function animReset(clearStatus) {
    animToken++;
    if (traveller) { getMap().removeLayer(traveller); traveller = null; }
    if (clearStatus !== false) {
        document.getElementById('anim_status').innerHTML = '第 1 / ' + STOPS.length + ' 站 · 上海';
        getMap().flyTo([36.0, -70.0], 3, { duration: 1.0 });
    }
    animBusy = false;
}
